name: Update Language Table
env:
  NODE_VERSION: "24.8.0"

on:
  push:
    paths:
      - "languages.json"
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types:
      - file-fully-translated
  workflow_dispatch:

jobs:
  update-language-table:
    if: github.repository_owner == 'deadlock-mod-manager'
    runs-on: depot-ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get bot token
        id: bot-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml
      - uses: pnpm/action-setup@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate language table
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: pnpm bun scripts/generate-language-table.ts --update-readme

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet HEAD -- README*.md; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in README files"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in README files"
          fi

      - name: Open or update pull request
        if: steps.check-changes.outputs.changes == 'true' && (github.ref == 'refs/heads/main')
        uses: ./.github/actions/open-bot-pr
        with:
          branch: chore/language-table
          title: "chore: update language table with Crowdin progress"
          paths: README*.md
          body: Refreshes the README language tables from Crowdin progress.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Output summary
        run: |
          echo "## Language Table Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.changes }}" == "true" ]; then
            echo "✅ Language table was updated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Updated Files:" >> $GITHUB_STEP_SUMMARY
            echo "- All README*.md files" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes were needed - language table is already up to date" >> $GITHUB_STEP_SUMMARY
          fi
