name: Publish APT Repository

# Rebuilds the APT repository at https://apt.deadlockmods.app from the .deb
# assets of the latest stable GitHub releases, signs it, and syncs it to R2.
# The repository is regenerated from scratch on every run, so re-running this
# workflow is always safe.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      keep-releases:
        description: Number of stable releases to keep in the repository
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: publish-apt
  cancel-in-progress: false

env:
  APT_BUCKET: deadlock-apt
  APT_SUITE: stable
  # main: regular (system webview) build. cef: Chromium Embedded Framework build.
  # Both ship the deadlock-mod-manager package so the in-app updater keeps
  # working; users enable one component.
  APT_COMPONENTS: main cef
  APT_ARCH: amd64

jobs:
  publish-apt:
    if: github.repository_owner == 'deadlock-mod-manager'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tauri bundle configs
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            apps/desktop/src-tauri/tauri.conf.json
            apps/desktop/src-tauri/tauri.cef.conf.json
          sparse-checkout-cone-mode: false

      - name: Download .deb packages from releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ inputs.keep-releases || '5' }}
        run: |
          set -euo pipefail
          mkdir -p downloads

          if ! [[ "$KEEP_RELEASES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::keep-releases must be a positive integer, got '$KEEP_RELEASES'"
            exit 1
          fi

          # Slice in jq rather than piping to head, which would SIGPIPE gh under pipefail.
          TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --exclude-drafts --exclude-pre-releases --json tagName \
            --jq "[.[].tagName | select(test(\"nightly\") | not)][:$KEEP_RELEASES][]")

          if [[ -z "$TAGS" ]]; then
            echo "::error::No stable releases found"
            exit 1
          fi

          for TAG in $TAGS; do
            echo "Downloading .deb packages from $TAG"
            # Regular builds end in _amd64.deb, CEF builds in _amd64-cef.deb.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern '*_amd64.deb' --pattern '*_amd64-cef.deb' --dir "downloads/$TAG" \
              || echo "::warning::No .deb asset in $TAG, skipping"
          done

      - name: Build repository layout
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Dependencies each build must declare, from the current bundle configs.
          # tauri.cef.conf.json replaces the base depends array when merged.
          CONF=apps/desktop/src-tauri
          REQUIRED_main=$(jq -r '.bundle.linux.deb.depends // [] | .[]' "$CONF/tauri.conf.json")
          REQUIRED_cef=$(jq -r '.bundle.linux.deb.depends // [] | .[]' "$CONF/tauri.cef.conf.json")

          for TAG_DIR in downloads/*/; do
            TAG=$(basename "$TAG_DIR")
            for DEB in "$TAG_DIR"*.deb; do
              if [[ "$DEB" == *-cef.deb ]]; then COMPONENT=cef; else COMPONENT=main; fi
              POOL="repo/pool/$COMPONENT/d/deadlock-mod-manager"
              mkdir -p "$POOL"

              PKG=$(dpkg-deb -f "$DEB" Package)
              VER=$(dpkg-deb -f "$DEB" Version)
              ARCH=$(dpkg-deb -f "$DEB" Architecture)
              DEPENDS=$(dpkg-deb -f "$DEB" Depends)
              NEW_VER="$VER"
              NEW_DEPENDS="$DEPENDS"

              # Older CEF builds in stable releases were stamped with a nightly
              # version (e.g. 1.2.0-nightly.* in the v1.1.0 release), which apt
              # would rank above the next stable release. Publish them under the
              # release version instead.
              if [[ "$COMPONENT" == cef && "$VER" != "${TAG#v}" ]]; then
                NEW_VER="${TAG#v}"
              fi

              # Packages built before a dependency was added to the bundle config
              # (e.g. CEF builds without libnss3) install but fail to start.
              REQUIRED_VAR="REQUIRED_$COMPONENT"
              while IFS= read -r DEP; do
                [[ -z "$DEP" ]] && continue
                if ! grep -qF -- "$DEP" <<< "$NEW_DEPENDS"; then
                  NEW_DEPENDS="${NEW_DEPENDS:+$NEW_DEPENDS, }$DEP"
                fi
              done <<< "${!REQUIRED_VAR}"

              if [[ "$NEW_VER" != "$VER" || "$NEW_DEPENDS" != "$DEPENDS" ]]; then
                echo "Repacking $DEB"
                echo "  Version: $VER -> $NEW_VER"
                echo "  Depends: $DEPENDS -> $NEW_DEPENDS"
                VER="$NEW_VER"
                WORK=$(mktemp -d)
                dpkg-deb -R "$DEB" "$WORK/pkg"
                sed -i -e "s/^Version: .*/Version: $NEW_VER/" \
                  -e "s/^Depends: .*/Depends: $NEW_DEPENDS/" "$WORK/pkg/DEBIAN/control"
                # Pin timestamps so every run produces a byte-identical package.
                EPOCH=$(stat -c %Y "$WORK/pkg/usr")
                touch -h -d "@$EPOCH" "$WORK/pkg/DEBIAN" "$WORK/pkg/DEBIAN"/*
                SOURCE_DATE_EPOCH="$EPOCH" dpkg-deb --root-owner-group -Zxz \
                  -b "$WORK/pkg" "$WORK/out.deb" >/dev/null
                OUT="$WORK/out.deb"
              else
                OUT="$DEB"
              fi

              # Pool files are cached as immutable, so name them by content: a
              # repacked package never reuses the URL of an earlier version of it.
              HASH=$(sha256sum "$OUT" | cut -c1-12)
              cp "$OUT" "$POOL/${PKG}_${VER}_${ARCH}_${HASH}.deb"
              if [[ "$OUT" != "$DEB" ]]; then rm -rf "$(dirname "$OUT")"; fi
            done
          done

          if [[ ! -d repo/pool/main ]]; then
            echo "::error::No regular .deb packages downloaded"
            exit 1
          fi
          ls -laR repo/pool

          cd repo
          for COMPONENT in $APT_COMPONENTS; do
            BINARY_DIR="dists/$APT_SUITE/$COMPONENT/binary-$APT_ARCH"
            mkdir -p "$BINARY_DIR"
            # An empty index is still valid, so a component without packages yet
            # doesn't break apt update for users who enabled it.
            if [[ -d "pool/$COMPONENT" ]]; then
              apt-ftparchive packages "pool/$COMPONENT" > "$BINARY_DIR/Packages"
            else
              : > "$BINARY_DIR/Packages"
            fi
            gzip -9kn "$BINARY_DIR/Packages"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Deadlock Mod Manager" \
            -o APT::FTPArchive::Release::Label="Deadlock Mod Manager" \
            -o APT::FTPArchive::Release::Suite="$APT_SUITE" \
            -o APT::FTPArchive::Release::Codename="$APT_SUITE" \
            -o APT::FTPArchive::Release::Architectures="$APT_ARCH" \
            -o APT::FTPArchive::Release::Components="$APT_COMPONENTS" \
            -o APT::FTPArchive::Release::Description="Deadlock Mod Manager APT repository" \
            release "dists/$APT_SUITE" > Release.tmp
          # Written outside dists/ so apt-ftparchive doesn't hash a partial Release.
          mv Release.tmp "dists/$APT_SUITE/Release"

      - name: Sign repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APT_GPG_PRIVATE_KEY" ]]; then
            echo "::error::APT_GPG_PRIVATE_KEY secret is not set"
            exit 1
          fi

          export GNUPGHOME="$(mktemp -d)"
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ && !seen {print $10; seen=1}')

          RELEASE="repo/dists/$APT_SUITE/Release"
          gpg --batch --yes --local-user "$FPR" --clearsign -o "repo/dists/$APT_SUITE/InRelease" "$RELEASE"
          gpg --batch --yes --local-user "$FPR" --armor --detach-sign -o "$RELEASE.gpg" "$RELEASE"

          gpg --export "$FPR" > repo/key.gpg
          gpg --armor --export "$FPR" > repo/key.asc

          gpg --verify "repo/dists/$APT_SUITE/InRelease"

      - name: Verify repository with apt
        run: |
          set -euo pipefail
          # Point a throwaway apt configuration at the local repository to make
          # sure the signature and indexes are valid before uploading.
          # Each component is checked on its own, the way users enable it.
          for COMPONENT in $APT_COMPONENTS; do
            echo "::group::Verify $COMPONENT"
            ROOT="$(mktemp -d)"
            mkdir -p "$ROOT/etc/apt/sources.list.d" "$ROOT/etc/apt/preferences.d" \
              "$ROOT/var/lib/apt/lists/partial" "$ROOT/var/cache/apt/archives/partial" \
              "$ROOT/var/lib/dpkg"
            touch "$ROOT/var/lib/dpkg/status"
            echo "deb [signed-by=$PWD/repo/key.gpg] file://$PWD/repo $APT_SUITE $COMPONENT" \
              > "$ROOT/etc/apt/sources.list"

            APT_OPTS=(-o Dir="$ROOT" -o Dir::State::status="$ROOT/var/lib/dpkg/status" \
              -o Debug::NoLocking=1 -o APT::Architecture="$APT_ARCH")
            apt-get "${APT_OPTS[@]}" update
            apt-cache "${APT_OPTS[@]}" policy deadlock-mod-manager
            echo "::endgroup::"
          done

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.APT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.APT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ENDPOINT: ${{ secrets.APT_R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" ]]; then
            echo "::error::APT_R2_* secrets are not set"
            exit 1
          fi

          S3="aws s3 --endpoint-url $R2_ENDPOINT"
          DEST="s3://$APT_BUCKET"

          # Upload new packages before the indexes that reference them, and only
          # prune old packages once the new indexes are live, so clients never
          # see an index pointing at a missing file.
          $S3 sync repo/pool "$DEST/pool" --no-progress \
            --content-type application/vnd.debian.binary-package \
            --cache-control "public, max-age=31536000, immutable"

          $S3 cp repo/key.gpg "$DEST/key.gpg" --cache-control "public, max-age=3600" \
            --content-type application/pgp-keys
          $S3 cp repo/key.asc "$DEST/key.asc" --cache-control "public, max-age=3600" \
            --content-type application/pgp-keys

          # Indexes first, then the signed Release files that reference them.
          $S3 sync repo/dists "$DEST/dists" --no-progress --delete \
            --exclude "*/Release" --exclude "*/Release.gpg" --exclude "*/InRelease" \
            --cache-control "no-cache"
          for FILE in Release Release.gpg InRelease; do
            $S3 cp "repo/dists/$APT_SUITE/$FILE" "$DEST/dists/$APT_SUITE/$FILE" \
              --cache-control "no-cache" --content-type text/plain
          done

          $S3 sync repo/pool "$DEST/pool" --no-progress --delete \
            --cache-control "public, max-age=31536000, immutable"
