name: Update AUR PKGBUILD for git package

on:
  push:
    branches:
      - main
    paths:
      - "distribution/aur/deadlock-modmanager-git/**"
  workflow_dispatch:

jobs:
  aur-git-push:
    if: github.repository_owner == 'deadlock-mod-manager'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy PKGBUILD for deploy
        run: cp -r distribution/aur/deadlock-modmanager-git ./deadlock-modmanager-git

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: deadlock-modmanager-git
          pkgbuild: deadlock-modmanager-git/PKGBUILD
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Sync PKGBUILD from repo"
          updpkgsums: true
