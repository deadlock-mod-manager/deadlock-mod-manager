name: Release Desktop App

env:
  NODE_VERSION: "24.8.0"

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  create-release:
    if: github.repository_owner == 'deadlock-mod-manager'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      package_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get version
        id: get-version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get previous release tag
        id: previous-tag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "nightly" | grep -v "v${{ steps.get-version.outputs.version }}" | head -1)
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous release tag: $PREVIOUS_TAG"

      - name: Generate release notes
        id: release-notes
        run: |
          RELEASE_NOTES=$(bun run scripts/generate-release-notes.ts "${{ steps.get-version.outputs.version }}" "${{ steps.previous-tag.outputs.previous_tag }}")

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or get existing release
        id: create-release
        uses: actions/github-script@v9
        env:
          RELEASE_BODY: ${{ steps.release-notes.outputs.release_notes }}
          PACKAGE_VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.PACKAGE_VERSION}`;
            const releaseBody = process.env.RELEASE_BODY;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              
              console.log(`Found existing release: ${release.id}`);
              
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: releaseBody
              });
              
              return release.id;
            } catch (error) {
              if (error.status === 404) {
                console.log(`Creating new release for tag: ${tag}`);
                const { data } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Release ${process.env.PACKAGE_VERSION}`,
                  body: releaseBody,
                  draft: true,
                  prerelease: false
                });
                return data.id;
              } else {
                throw error;
              }
            }

  build-cef:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/_build-cef.yml
    with:
      release_id: ${{ needs.create-release.outputs.release_id }}
      version: v${{ needs.create-release.outputs.package_version }}
      nightly: false
      signpath_policy: release-signing
    secrets:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-24.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> apps/desktop/target

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6

      # Required by prost-build, pulled in transitively via steam-vent/valveprotos.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apt dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            flatpak \
            flatpak-builder

      - name: Install Flatpak SDK (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        uses: ./.github/actions/install-flatpak-sdk
        with:
          runtime-version: "49"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      # Linux build - upload directly to release
      - name: Build the app (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          VITE_API_URL: https://api.deadlockmods.app
          VITE_WEB_URL: https://deadlockmods.app
          VITE_AUTH_URL: https://auth.deadlockmods.app
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        with:
          projectPath: ./apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Build Flatpak bundle (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: ./.github/actions/build-flatpak-bundle
        with:
          bundle-filename: deadlock-mod-manager.flatpak

      - name: Upload Flatpak to release (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const releaseId = parseInt(process.env.RELEASE_ID);
            const content = fs.readFileSync('deadlock-mod-manager.flatpak');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'deadlock-mod-manager.flatpak',
              data: content
            });
            console.log('Successfully uploaded Flatpak bundle');

      # Windows build - don't upload to release yet, need to code-sign first
      - name: Build the app (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          VITE_API_URL: https://api.deadlockmods.app
          VITE_WEB_URL: https://deadlockmods.app
          VITE_AUTH_URL: https://auth.deadlockmods.app
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        with:
          projectPath: ./apps/desktop
          args: "--bundles nsis,updater"

      - name: Stage standalone Windows executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath apps/desktop/package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath apps/desktop/target/release/deadlock-mod-manager.exe -Destination "apps/desktop/target/release/bundle/nsis/Deadlock Mod Manager_${version}_x64-portable.exe"

      # Windows: SignPath code signing flow
      - name: Sign Windows executables
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/signpath-sign
        with:
          unsigned-artifact-path: apps/desktop/target/release/bundle/nsis/*.exe
          artifact-name: windows-unsigned-regular
          output-directory: ./artifact-output
          signpath-api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signpath-organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          signpath-project-slug: deadlock-mod-manager
          signpath-signing-policy: release-signing
          tauri-private-key: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Upload signed Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-signed
          path: ./artifact-output/*
          if-no-files-found: error

      - name: Upload signed artifacts to release
        if: matrix.platform == 'windows-latest'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const artifactDir = './artifact-output';
            const files = fs.readdirSync(artifactDir);

            for (const file of files) {
              const filePath = path.join(artifactDir, file);
              const stats = fs.statSync(filePath);
              
              if (stats.isFile()) {
                console.log(`Uploading ${file} to release...`);
                const content = fs.readFileSync(filePath);
                
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: parseInt(process.env.RELEASE_ID),
                  name: file,
                  data: content
                });
                
                console.log(`Successfully uploaded ${file}`);
              }
            }

  update-latest-json:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Windows signed artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-signed
          path: release-artifacts/windows

      - name: Update latest.json
        uses: ./.github/actions/update-latest-json
        with:
          release-id: ${{ needs.create-release.outputs.release_id }}
          signed-artifact-path: ./release-artifacts/windows
          version: v${{ needs.create-release.outputs.package_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  update-latest-cef-json:
    needs: [create-release, build-cef]
    if: always() && needs.build-cef.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Update latest-cef.json
        uses: ./.github/actions/update-latest-cef-json
        with:
          release-id: ${{ needs.create-release.outputs.release_id }}
          version: v${{ needs.create-release.outputs.package_version }}
          app-version: ${{ needs.create-release.outputs.package_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, update-latest-json]
    if: always() && needs.build-tauri.result == 'success'

    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            try {
              console.log(`Updating release ID: ${process.env.release_id}`);
              
              const { data: currentRelease } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: process.env.release_id
              });
              
              console.log(`Current release state - Draft: ${currentRelease.draft}, Tag: ${currentRelease.tag_name}`);
              
              const { data: updatedRelease } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: process.env.release_id,
                draft: false,
                prerelease: false
              });
              
              console.log(`Successfully published release: ${updatedRelease.html_url}`);
              return updatedRelease.id;
            } catch (error) {
              console.error(`Failed to publish release: ${error.message}`);
              console.error(`Error details:`, error);
              throw error;
            }

  cleanup-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: failure()

    steps:
      - name: Delete release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id
            })
