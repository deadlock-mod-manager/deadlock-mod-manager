name: Issue 1371 Windows test build

on:
  push:
    branches: [bugfix/1371-non-scored-matches]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VITE_API_URL: https://api.deadlockmods.app
      VITE_WEB_URL: https://deadlockmods.app
      VITE_AUTH_URL: https://auth.deadlockmods.app
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check desktop types
        run: pnpm --filter @deadlock-mods/desktop check-types
      - name: Test match outcomes and rendering
        working-directory: apps/desktop
        run: bun test --isolate src/lib/stats/derive.test.ts src/lib/stats/live-lobby.test.ts src/lib/stats/dashboard/match-query.test.ts src/components/stats/recent-matches.test.tsx
      - name: Test match sync
        run: cargo test --manifest-path packages/deadlock-match-sync/Cargo.toml
      - name: Check match sync with Clippy
        run: cargo clippy --manifest-path packages/deadlock-match-sync/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned Windows installer
        run: pnpm --filter @deadlock-mods/desktop tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Record source commit and checksums
        shell: pwsh
        run: |
          $env:GITHUB_SHA | Set-Content apps/desktop/target/release/SOURCE_COMMIT.txt
          Get-FileHash apps/desktop/target/release/deadlock-mod-manager.exe, apps/desktop/target/release/bundle/nsis/*.exe -Algorithm SHA256 | Format-List | Out-File apps/desktop/target/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: deadlock-mod-manager-issue-1371-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/target/release/deadlock-mod-manager.exe
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/SOURCE_COMMIT.txt
            apps/desktop/target/release/SHA256SUMS.txt
