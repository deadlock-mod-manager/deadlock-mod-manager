name: Refresh performance catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC; perf-catalog-watch.yml also starts it for new convar dumps

concurrency:
  group: perf-catalog
  cancel-in-progress: false

env:
  NODE_VERSION: "24.8.0"
  BRANCH: chore/perf-catalog-refresh

jobs:
  refresh:
    if: github.repository_owner == 'deadlock-mod-manager'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get bot token
        id: bot-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # GameBanana configs ship as zip, rar and 7z archives.
      - name: Install bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @deadlock-mods/perf-catalog

      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: packages/perf-catalog/.cache
          key: perf-catalog-${{ hashFiles('packages/perf-catalog/sources.json') }}
          restore-keys: perf-catalog-

      - name: Refresh pins and regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm perf:catalog --refresh --summary "$RUNNER_TEMP/perf-catalog-summary.md"

      - name: Test catalog
        run: pnpm --filter @deadlock-mods/perf-catalog test

      - name: Check for changes
        id: git-check
        run: |
          # sources.json too, so a new dump that changes no convars still moves the pin the watcher compares.
          git diff --quiet packages/perf-catalog/data/catalog.json packages/perf-catalog/sources.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add packages/perf-catalog/data/catalog.json packages/perf-catalog/sources.json
          git commit -m "chore(perf-catalog): refresh performance catalog"
          git push --force origin "$BRANCH"
          {
            echo "Automated refresh of \`packages/perf-catalog\` (\`pnpm perf:catalog --refresh\`)."
            echo "Merges on its own once CI passes."
            echo
            cat "$RUNNER_TEMP/perf-catalog-summary.md"
          } > "$RUNNER_TEMP/perf-catalog-pr.md"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/perf-catalog-pr.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(perf-catalog): refresh performance catalog" \
              --body-file "$RUNNER_TEMP/perf-catalog-pr.md"
          fi
          gh pr merge "$BRANCH" --auto
