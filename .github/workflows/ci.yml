name: CI

env:
  NODE_VERSION: "24.8.0"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-types:
    name: Type Check
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain pins
        run: pnpm check:toolchain

      - name: Type check agent tooling
        run: pnpm check-types:tooling

      - name: Test agent tooling
        run: pnpm test:tooling

      - name: Check unused code against reviewed baseline
        run: pnpm knip:check

      - name: Run type check
        run: pnpm check-types

  test:
    name: Run Tests
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dmm_test
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/vpk-parser -> packages/vpk-parser/target
            packages/kv-parser -> packages/kv-parser/target
            packages/dmodpkg -> packages/dmodpkg/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native dependencies
        run: |
          FAILED_PACKAGES=()

          if ! pnpm --filter @deadlock-mods/vpk-parser build; then
            echo "::error::Build failed for @deadlock-mods/vpk-parser"
            FAILED_PACKAGES+=("@deadlock-mods/vpk-parser")
          fi

          if ! pnpm --filter @deadlock-mods/kv-parser build; then
            echo "::error::Build failed for @deadlock-mods/kv-parser"
            FAILED_PACKAGES+=("@deadlock-mods/kv-parser")
          fi

          if ! pnpm --filter @deadlock-mods/dmodpkg build; then
            echo "::error::Build failed for @deadlock-mods/dmodpkg"
            FAILED_PACKAGES+=("@deadlock-mods/dmodpkg")
          fi

          if [ ${#FAILED_PACKAGES[@]} -gt 0 ]; then
            echo "::error::Native build failed for the following packages: ${FAILED_PACKAGES[*]}"
            exit 1
          fi

      - name: Run tests
        run: pnpm test

  test-rust:
    name: Run Rust Tests
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - uses: pnpm/action-setup@v6

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds frontendDist, so dist must exist before cargo test.
      - name: Build frontend
        run: pnpm --filter @deadlock-mods/desktop ui:build

      # Skip list mirrors checkFlags in package.nix so CI and the Nix build agree.
      - name: Run Rust tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked \
            -- --skip download_manager::downloader::tests::test_download_file
