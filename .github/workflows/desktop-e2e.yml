name: Desktop E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/desktop/**
      - packages/**
      - pnpm-lock.yaml
      - package.json
      - .github/actions/setup-desktop-e2e/**
      - .github/workflows/desktop-e2e.yml
      - flake.nix
      - flake.lock
      - package.nix
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run
        type: choice
        options: [all, nix]
        default: all

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build isolated harness
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && inputs.platforms != 'nix'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop -> target
          shared-key: desktop-e2e-debug
      - name: Harness checks
        run: |
          pnpm --filter @deadlock-mods/desktop e2e:check-types
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @deadlock-mods/desktop e2e:test:world
      - name: Build application
        run: pnpm --filter @deadlock-mods/desktop e2e:build
      - name: Build native helper
        run: pnpm --filter @deadlock-mods/desktop e2e:build:picker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-binaries
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/target/debug/deadlock-mod-manager.exe
            apps/desktop/e2e/native/Picker/bin/Release/net10.0-windows/**

  scenarios:
    name: Windows scenarios (${{ matrix.suite }}${{ matrix.seed && format(' seed {0}', matrix.seed) || '' }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            smoke,
            local,
            profiles,
            downloads,
            filesystem,
            gamebanana,
            settings,
            skins,
            interchange,
          ]
        # Fixed seeds keep failures reproducible: 0 is the default, 887
        # replays #891 and 4 retries an update straight after a failure.
        include:
          - { suite: monkey, seed: "0" }
          - { suite: monkey, seed: "887" }
          - { suite: monkey, seed: "4" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-e2e-binaries
          path: apps/desktop
      - name: Check runner prerequisites
        run: pnpm --filter @deadlock-mods/desktop e2e:doctor -- --case local-mod-lifecycle
      - name: Run serial scenarios on the disposable runner desktop
        env:
          E2E_SUITE: ${{ matrix.suite }}
          DMM_E2E_SEED: ${{ matrix.seed }}
        run: pnpm --filter @deadlock-mods/desktop e2e:test -- --suite $env:E2E_SUITE --keep --allow-native-input --report ../../.e2e/reports/scenarios.json
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-${{ matrix.suite }}${{ matrix.seed && format('-{0}', matrix.seed) || '' }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/app-logs/**
            .e2e/worlds/**/world-manifest.json

  linux-build:
    name: Build isolated harness (${{ matrix.distro }})
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && inputs.platforms != 'nix'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 60
    env:
      # Arch can ship a system libvips that makes sharp compile from source.
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:trixie
          - distro: arch
            image: archlinux:latest
    steps:
      - name: Install Debian packages
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git file pkg-config unzip xz-utils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev protobuf-compiler libprotobuf-dev
      - name: Install Arch packages
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm --needed base-devel curl git file pkgconf unzip xz \
            webkit2gtk-4.1 libappindicator-gtk3 librsvg openssl protobuf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop -> target
          shared-key: desktop-e2e-debug-${{ matrix.distro }}
      - name: Build application
        run: pnpm --filter @deadlock-mods/desktop e2e:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-binaries-${{ matrix.distro }}
          retention-days: 3
          if-no-files-found: error
          path: apps/desktop/target/debug/deadlock-mod-manager

  linux-scenarios:
    name: Linux scenarios (${{ matrix.distro }}, ${{ matrix.suite }}${{ matrix.seed && format(' seed {0}', matrix.seed) || '' }})
    needs: linux-build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 25
    env:
      # Arch can ship a system libvips that makes sharp compile from source.
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, arch]
        # local and profiles need the Windows native input helper.
        suite:
          [
            smoke,
            conflicts,
            downloads,
            filesystem,
            gamebanana,
            settings,
            skins,
            interchange,
          ]
        include:
          - distro: debian
            image: debian:trixie
          - distro: arch
            image: archlinux:latest
          - { distro: debian, image: "debian:trixie", suite: monkey, seed: "0" }
          - { distro: debian, image: "debian:trixie", suite: monkey, seed: "887" }
        # The app has no per-distro code paths, so one full Linux run is
        # enough. Arch's rolling WebKitGTK only needs the startup check.
        exclude:
          - { distro: arch, suite: conflicts }
          - { distro: arch, suite: downloads }
          - { distro: arch, suite: filesystem }
          - { distro: arch, suite: gamebanana }
          - { distro: arch, suite: settings }
          - { distro: arch, suite: skins }
          - { distro: arch, suite: interchange }
    steps:
      - name: Install Debian packages
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils \
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 \
            libgl1-mesa-dri xvfb xauth dbus fonts-dejavu-core
      - name: Install Arch packages
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm --needed curl git unzip xz \
            webkit2gtk-4.1 libappindicator-gtk3 librsvg \
            mesa xorg-server-xvfb xorg-xauth dbus ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-e2e-binaries-${{ matrix.distro }}
          path: apps/desktop/target/debug
      - name: Restore executable permission
        run: chmod +x apps/desktop/target/debug/deadlock-mod-manager
      - name: Check runner prerequisites
        run: xvfb-run -a pnpm --filter @deadlock-mods/desktop e2e:doctor
      - name: Run serial scenarios on a virtual display
        env:
          E2E_SUITE: ${{ matrix.suite }}
          DMM_E2E_SEED: ${{ matrix.seed }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- pnpm --filter @deadlock-mods/desktop e2e:test -- --suite "$E2E_SUITE" --keep --report ../../.e2e/reports/scenarios.json
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-${{ matrix.distro }}-${{ matrix.suite }}${{ matrix.seed && format('-{0}', matrix.seed) || '' }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/app-logs/**
            .e2e/worlds/**/world-manifest.json

  nix-build:
    name: Build isolated harness (nix)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      NIX_BUILD_CORES: "8"
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # Hashes in package.nix are refreshed on main by nix-test.yml, so a PR
      # that changes pnpm-lock.yaml or Cargo.lock fails here until then.
      - name: Build application
        run: nix build .#e2e --print-build-logs
      - name: Check harness feature
        run: grep -rqa "e2e-harness builds require an E2E configuration" result/bin
      # Ship the closure as a binary-cache artifact: magic-nix-cache gets rate
      # limited when every scenario job substitutes at once.
      - name: Export application closure
        run: |
          nix copy --to "file://$RUNNER_TEMP/nix-closure?compression=zstd" ./result
          readlink -f result > "$RUNNER_TEMP/nix-closure/e2e-out-path"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-binaries-nix
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/nix-closure

  nix-scenarios:
    name: Linux scenarios (nix)
    needs: nix-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-e2e-binaries-nix
          path: ${{ runner.temp }}/nix-closure
      - name: Import application closure
        run: |
          out="$(cat "$RUNNER_TEMP/nix-closure/e2e-out-path")"
          nix copy --from "file://$RUNNER_TEMP/nix-closure" --no-check-sigs "$out"
          echo "DMM_NIX_E2E_BINARY=$out/bin/deadlock-mod-manager" >> "$GITHUB_ENV"
      # Nix's libglvnd looks for drivers in /run/opengl-driver, which NixOS
      # provides through hardware.graphics; recreate it from the pinned mesa.
      - name: Provide NixOS graphics drivers
        run: sudo ln -sfn "$(nix build --inputs-from . nixpkgs#mesa --no-link --print-out-paths)" /run/opengl-driver
      # The harness only drives the app, so it runs on the host toolchain.
      # Doctor is skipped: it probes the host for WebKitGTK, which the Nix
      # closure provides instead.
      - uses: ./.github/actions/setup-desktop-e2e
      # The display and session bus come from the host: Nix's dbus only ships
      # a stub session.conf that includes NixOS's /etc/dbus-1 configuration.
      - name: Install display packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus
      # Debian and Arch cover app behaviour; these suites check that the Nix
      # package starts and can reach the game and app-data directories.
      - name: Run serial scenarios on a virtual display
        run: |
          status=0
          for suite in smoke filesystem; do
            xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- \
              pnpm --filter @deadlock-mods/desktop e2e:test -- --suite "$suite" --binary "$DMM_NIX_E2E_BINARY" --keep --report "../../.e2e/reports/$suite.json" || status=1
          done
          exit "$status"
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-nix
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/app-logs/**
            .e2e/worlds/**/world-manifest.json
