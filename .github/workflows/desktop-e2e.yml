name: Desktop E2E

on:
  workflow_call:
    inputs:
      required:
        description: Run selected coverage as part of the required CI gate
        type: boolean
        default: false
      platforms:
        type: string
        default: windows
      suites:
        type: string
        default: '["critical"]'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/desktop/**
      - packages/**
      - pnpm-lock.yaml
      - package.json
      - .github/actions/setup-desktop-e2e/**
      - .github/workflows/desktop-e2e.yml
      - flake.nix
      - flake.lock
      - package.nix
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run
        type: choice
        options: [all, windows, nix]
        default: all
      suites:
        description: 'Windows suites as a JSON array, e.g. ["profiles","conflicts"]. Empty runs every suite.'
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ inputs.required && 'required' || 'full' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build isolated harness
    if: (inputs.required || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && inputs.platforms != 'nix'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop -> target
          shared-key: desktop-e2e-debug
      - name: Harness checks
        run: |
          pnpm --filter @deadlock-mods/desktop e2e:check-types
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @deadlock-mods/desktop e2e:test:world
      - name: Build application
        run: pnpm --filter @deadlock-mods/desktop e2e:build
      - name: Build native helper
        run: pnpm --filter @deadlock-mods/desktop e2e:build:picker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-e2e-binaries
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/target/debug/deadlock-mod-manager.exe
            apps/desktop/e2e/native/Picker/bin/Release/net10.0-windows/**

  scenarios:
    name: Windows scenarios (${{ matrix.suite }}${{ matrix.seed && format(' seed {0}', matrix.seed) || '' }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites || '["smoke","updater","library-groups","compatibility","local","local-large","profiles","conflicts","downloads","filesystem","gamebanana","settings","skins","interchange","shards","missing-vpks","catalog","navigation","onboarding","stats","diagnostics","performance","addons-analysis","analysis","analyze","fixed-status","profile-share"]') }}
        include: ${{ fromJSON((!inputs.suites || contains(inputs.suites, '"monkey"')) && '[{"suite":"monkey","seed":"0"},{"suite":"monkey","seed":"887"},{"suite":"monkey","seed":"4"}]' || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-e2e-binaries
          path: apps/desktop
      - name: Check runner prerequisites
        run: pnpm --filter @deadlock-mods/desktop e2e:doctor -- --case local-mod-lifecycle
      - name: Run serial scenarios on the disposable runner desktop
        env:
          E2E_SUITE: ${{ matrix.suite }}
          DMM_E2E_SEED: ${{ matrix.seed }}
        run: pnpm --filter @deadlock-mods/desktop e2e:test -- --suite $env:E2E_SUITE --keep --allow-native-input --report ../../.e2e/reports/scenarios.json
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-e2e-${{ matrix.suite }}${{ matrix.seed && format('-{0}', matrix.seed) || '' }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/app-logs/**
            .e2e/worlds/**/world-manifest.json

  linux-build:
    name: Build isolated harness (${{ matrix.distro }})
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && inputs.platforms != 'nix' && inputs.platforms != 'windows'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 60
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:trixie
          - distro: arch
            image: archlinux:latest
    steps:
      - name: Install Debian packages
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git file pkg-config unzip xz-utils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev protobuf-compiler libprotobuf-dev
      - name: Install Arch packages
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm --needed base-devel curl git file pkgconf unzip xz \
            webkit2gtk-4.1 libappindicator-gtk3 librsvg openssl protobuf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop -> target
          shared-key: desktop-e2e-debug-${{ matrix.distro }}
      - name: Build application
        run: pnpm --filter @deadlock-mods/desktop e2e:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-e2e-binaries-${{ matrix.distro }}
          retention-days: 3
          if-no-files-found: error
          path: apps/desktop/target/debug/deadlock-mod-manager

  linux-scenarios:
    name: Linux scenarios (${{ matrix.distro }}, ${{ matrix.suite }}${{ matrix.seed && format(' seed {0}', matrix.seed) || '' }})
    needs: linux-build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 25
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, arch]
        suite:
          [
            smoke,
            updater,
            library-groups,
            compatibility,
            conflicts,
            downloads,
            filesystem,
            gamebanana,
            settings,
            skins,
            interchange,
            shards,
            performance,
            fixed-status,
          ]
        include:
          - distro: debian
            image: debian:trixie
          - distro: arch
            image: archlinux:latest
          - { distro: debian, image: "debian:trixie", suite: monkey, seed: "0" }
          - {
              distro: debian,
              image: "debian:trixie",
              suite: monkey,
              seed: "887",
            }
        exclude:
          - { distro: arch, suite: compatibility }
          - { distro: arch, suite: conflicts }
          - { distro: arch, suite: downloads }
          - { distro: arch, suite: filesystem }
          - { distro: arch, suite: gamebanana }
          - { distro: arch, suite: settings }
          - { distro: arch, suite: skins }
          - { distro: arch, suite: interchange }
          - { distro: arch, suite: shards }
          - { distro: arch, suite: performance }
          - { distro: arch, suite: fixed-status }
    steps:
      - name: Install Debian packages
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils \
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 \
            libgl1-mesa-dri xvfb xauth xdotool dbus fonts-dejavu-core
      - name: Install Arch packages
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm --needed curl git unzip xz \
            webkit2gtk-4.1 libappindicator-gtk3 librsvg \
            mesa xorg-server-xvfb xorg-xauth xdotool dbus ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-e2e-binaries-${{ matrix.distro }}
          path: apps/desktop/target/debug
      - name: Restore executable permission
        run: chmod +x apps/desktop/target/debug/deadlock-mod-manager
      - name: Check runner prerequisites
        run: xvfb-run -a pnpm --filter @deadlock-mods/desktop e2e:doctor
      - name: Run serial scenarios on a virtual display
        env:
          E2E_SUITE: ${{ matrix.suite }}
          DMM_E2E_SEED: ${{ matrix.seed }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- pnpm --filter @deadlock-mods/desktop e2e:test -- --suite "$E2E_SUITE" --keep --allow-native-input --report ../../.e2e/reports/scenarios.json
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-e2e-${{ matrix.distro }}-${{ matrix.suite }}${{ matrix.seed && format('-{0}', matrix.seed) || '' }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/app-logs/**
            .e2e/worlds/**/world-manifest.json

  nix-build:
    name: Build isolated harness (nix)
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && inputs.platforms != 'windows'
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      NIX_BUILD_CORES: "8"
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
      - name: Build application
        run: nix build .#e2e --print-build-logs
      - name: Check harness feature
        run: grep -rqa "e2e-harness builds require an E2E configuration" result/bin
      - name: Export application closure
        run: |
          nix copy --to "file://$RUNNER_TEMP/nix-closure?compression=zstd" ./result
          readlink -f result > "$RUNNER_TEMP/nix-closure/e2e-out-path"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-e2e-binaries-nix
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/nix-closure

  nix-scenarios:
    name: Linux scenarios (nix)
    needs: nix-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-e2e-binaries-nix
          path: ${{ runner.temp }}/nix-closure
      - name: Import application closure
        run: |
          out="$(cat "$RUNNER_TEMP/nix-closure/e2e-out-path")"
          nix copy --from "file://$RUNNER_TEMP/nix-closure" --no-check-sigs "$out"
          echo "DMM_NIX_E2E_BINARY=$out/bin/deadlock-mod-manager" >> "$GITHUB_ENV"
      - name: Provide NixOS graphics drivers
        run: sudo ln -sfn "$(nix build --inputs-from . nixpkgs#mesa --no-link --print-out-paths)" /run/opengl-driver
      - uses: ./.github/actions/setup-desktop-e2e
      - name: Install display packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus
      - name: Run serial scenarios on a virtual display
        run: |
          status=0
          for suite in smoke filesystem; do
            xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- \
              pnpm --filter @deadlock-mods/desktop e2e:test -- --suite "$suite" --binary "$DMM_NIX_E2E_BINARY" --keep --report "../../.e2e/reports/$suite.json" || status=1
          done
          exit "$status"
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-e2e-nix
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/app-logs/**
            .e2e/worlds/**/world-manifest.json
