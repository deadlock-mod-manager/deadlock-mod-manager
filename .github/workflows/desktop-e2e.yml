name: Desktop E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/desktop/**
      - packages/**
      - pnpm-lock.yaml
      - package.json
      - .github/actions/setup-desktop-e2e/**
      - .github/workflows/desktop-e2e.yml
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build isolated harness
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          shared-key: desktop-e2e-debug
      - name: Harness checks
        run: |
          pnpm --filter @deadlock-mods/desktop e2e:check-types
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @deadlock-mods/desktop e2e:test:world
      - name: Build application
        run: pnpm --filter @deadlock-mods/desktop e2e:build
      - name: Build native helper
        run: pnpm --filter @deadlock-mods/desktop e2e:build:picker
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-binaries
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/target/debug/deadlock-mod-manager.exe
            apps/desktop/e2e/native/Picker/bin/Release/net10.0-windows/**

  scenarios:
    name: Windows scenarios (${{ matrix.suite }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, local, profiles, downloads, filesystem, gamebanana]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-desktop-e2e
      - uses: actions/download-artifact@v4
        with:
          name: desktop-e2e-binaries
          path: apps/desktop
      - name: Check runner prerequisites
        run: pnpm --filter @deadlock-mods/desktop e2e:doctor -- --case local-mod-lifecycle
      - name: Run serial scenarios on the disposable runner desktop
        env:
          E2E_SUITE: ${{ matrix.suite }}
        run: pnpm --filter @deadlock-mods/desktop e2e:test -- --suite $env:E2E_SUITE --keep --allow-native-input --report ../../.e2e/reports/scenarios.json
      - name: Retain scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ matrix.suite }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .e2e/reports/**
            .e2e/worlds/**/artifacts/**
            .e2e/worlds/**/world-manifest.json
