name: Test AUR PKGBUILDs

on:
  pull_request:
    paths:
      - "distribution/aur/**"
  push:
    paths:
      - "distribution/aur/**"
    tags:
      - "v*.*.*"
  # -git builds main, which can break without touching distribution/aur.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namcap-lint:
    name: Lint PKGBUILDs (namcap)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install namcap
        run: pacman -Syu --noconfirm namcap

      - name: Lint deadlock-modmanager
        run: namcap distribution/aur/deadlock-modmanager/PKGBUILD

      - name: Lint deadlock-modmanager-bin
        run: namcap distribution/aur/deadlock-modmanager-bin/PKGBUILD

      - name: Lint deadlock-modmanager-git
        run: namcap distribution/aur/deadlock-modmanager-git/PKGBUILD

  build:
    name: Build ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: deadlock-modmanager-bin
          # libvips makes sharp attempt a source build during pnpm install;
          # keep it installed so that regression is caught here.
          - pkg: deadlock-modmanager
            extra-packages: libvips
          - pkg: deadlock-modmanager-git
            extra-packages: libvips git
    steps:
      # Before checkout, so -git gets a real clone instead of a tarball.
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel ${{ matrix.extra-packages }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # pkgver() runs `git describe --tags` against the full history.
          fetch-depth: ${{ matrix.pkg == 'deadlock-modmanager-git' && '0' || '1' }}
          fetch-tags: ${{ matrix.pkg == 'deadlock-modmanager-git' }}

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder distribution/aur/${{ matrix.pkg }}

      - name: Point -git at this commit
        if: matrix.pkg == 'deadlock-modmanager-git'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git branch -f aur-ci HEAD
          su builder -c "git config --global --add safe.directory '*'"
          sed -i "s|git+https://github.com/deadlock-mod-manager/deadlock-mod-manager.git|git+file://$GITHUB_WORKSPACE#branch=aur-ci|" \
            distribution/aur/deadlock-modmanager-git/PKGBUILD
          grep -n '^source=' distribution/aur/deadlock-modmanager-git/PKGBUILD

      - name: Build package
        working-directory: distribution/aur/${{ matrix.pkg }}
        run: su builder -c "makepkg -sf --noconfirm"

      - name: Verify packaged file layout
        working-directory: distribution/aur/${{ matrix.pkg }}
        run: |
          set -euo pipefail
          pkg=$(find . -maxdepth 1 -name '${{ matrix.pkg }}-[0-9]*.pkg.tar.zst' | head -1)
          if [ -z "$pkg" ]; then
            echo "ERROR: No built package found!"
            exit 1
          fi
          contents=$(tar -tf "$pkg")

          if ! echo "$contents" | grep -x 'usr/bin/deadlock-modmanager' > /dev/null; then
            echo "ERROR: usr/bin/deadlock-modmanager not packaged!"
            exit 1
          fi

          desktops=$(echo "$contents" | grep 'usr/share/applications/.*\.desktop$' || true)
          if [ "$desktops" != "usr/share/applications/deadlock-modmanager.desktop" ]; then
            echo "ERROR: Expected exactly one desktop entry, got:"
            echo "$desktops"
            exit 1
          fi

          icons=$(echo "$contents" | grep 'usr/share/icons/.*\.png$' || true)
          if [ -z "$icons" ]; then
            echo "ERROR: No icons packaged!"
            exit 1
          fi
          bad_icons=$(echo "$icons" | grep -vE '^usr/share/icons/hicolor/[0-9]+x[0-9]+/apps/deadlock-modmanager\.png$' || true)
          if [ -n "$bad_icons" ]; then
            echo "ERROR: Icons outside the expected hicolor layout:"
            echo "$bad_icons"
            exit 1
          fi
          echo "Package layout verified:"
          echo "$contents"
