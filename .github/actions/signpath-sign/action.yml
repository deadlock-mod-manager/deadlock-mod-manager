name: "SignPath Code Signing"
description: "Sign Windows executables using SignPath and regenerate Tauri updater signature"

inputs:
  unsigned-artifact-path:
    description: "Path to the unsigned executable(s)"
    required: true
  artifact-name:
    description: "Unsigned artifact name prefix, unique across signing jobs in a workflow run"
    required: false
    default: "windows-unsigned"
  output-directory:
    description: "Directory to output signed artifacts"
    required: true
  signpath-api-token:
    description: "SignPath API token"
    required: true
  signpath-organization-id:
    description: "SignPath organization ID"
    required: true
  signpath-project-slug:
    description: "SignPath project slug"
    required: true
    default: "deadlock-mod-manager"
  signpath-signing-policy:
    description: "SignPath signing policy slug"
    required: true
    default: "release-signing"
  tauri-private-key:
    description: "Tauri signing private key for regenerating updater signature"
    required: true

outputs:
  signed-artifact-path:
    description: "Path to the signed artifact(s)"
    value: ${{ inputs.output-directory }}

runs:
  using: "composite"
  steps:
    - name: Stage unsigned executables for SignPath
      shell: bash
      run: |
        STAGING="./signpath-staging"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"

        shopt -s nullglob
        matches=(${{ inputs.unsigned-artifact-path }})
        if [ ${#matches[@]} -eq 0 ]; then
          echo "No executables matched: ${{ inputs.unsigned-artifact-path }}"
          exit 1
        fi

        for file in "${matches[@]}"; do
          cp "$file" "$STAGING/$(basename "$file")"
        done

        echo "Staged files for SignPath:"
        ls -la "$STAGING"

    - name: Upload unsigned artifact
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_id }}
        path: ./signpath-staging/*.exe
        if-no-files-found: error

    - name: Submit to SignPath
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ inputs.signpath-api-token }}
        organization-id: ${{ inputs.signpath-organization-id }}
        project-slug: ${{ inputs.signpath-project-slug }}
        signing-policy-slug: ${{ inputs.signpath-signing-policy }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: "./signpath-signed-output"

    - name: Verify signed executables
      shell: pwsh
      env:
        SIGNING_POLICY: ${{ inputs.signpath-signing-policy }}
        TEST_CERTIFICATE_THUMBPRINT: "62136E74626939AAD7B24B7C36EFFF7CA0FDC1D8"
      run: |
        $unsignedFiles = Get-ChildItem -LiteralPath ./signpath-staging -Filter *.exe
        foreach ($file in $unsignedFiles) {
          $signedPath = Join-Path ./signpath-signed-output $file.Name
          $signature = Get-AuthenticodeSignature -LiteralPath $signedPath
          Write-Host "Authenticode verification for $($file.Name): $($signature.Status)"
          Write-Host "Status message: $($signature.StatusMessage)"
          if ($null -ne $signature.SignerCertificate) {
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
            Write-Host "Issuer: $($signature.SignerCertificate.Issuer)"
            Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"
          }
          if ($env:SIGNING_POLICY -eq 'test-signing' -and $null -ne $signature.SignerCertificate -and $signature.SignerCertificate.Thumbprint -eq $env:TEST_CERTIFICATE_THUMBPRINT) {
            $certificate = $signature.SignerCertificate
            $alreadyTrusted = Test-Path "Cert:\CurrentUser\Root\$($certificate.Thumbprint)"
            $certificateAdded = $false
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'CurrentUser')
            try {
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              if (-not $alreadyTrusted) {
                $store.Add($certificate)
                $certificateAdded = $true
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $signedPath
              Write-Host "Verification with pinned test certificate: $($signature.Status): $($signature.StatusMessage)"
            } finally {
              if ($certificateAdded) {
                $store.Remove($certificate)
              }
              $store.Close()
            }
          }
          if ($signature.Status -ne 'Valid') {
            throw "Missing or invalid Authenticode signature for $($file.Name): $($signature.Status): $($signature.StatusMessage)"
          }
        }

    - name: Create output directory
      shell: bash
      run: mkdir -p "${{ inputs.output-directory }}"

    - name: List signed output contents
      shell: bash
      run: |
        echo "Contents of signpath-signed-output:"
        ls -la ./signpath-signed-output/ || echo "Directory doesn't exist or is empty"

    - name: Regenerate Tauri updater signatures
      shell: bash
      env:
        TAURI_PRIVATE_KEY: ${{ inputs.tauri-private-key }}
      run: |
        SIGNED_DIR="$(pwd)/signpath-signed-output"
        shopt -s nullglob
        exeFiles=("$SIGNED_DIR"/*.exe)
        if [ ${#exeFiles[@]} -eq 0 ]; then
          echo "No signed executables found in $SIGNED_DIR"
          exit 1
        fi

        for exeFile in "${exeFiles[@]}"; do
          echo "Regenerating Tauri signature for: $exeFile"
          pnpm --filter @deadlock-mods/desktop tauri signer sign -k "$TAURI_PRIVATE_KEY" -p "" "$exeFile"
        done

        mv "$SIGNED_DIR"/*.exe "${{ inputs.output-directory }}/"
        mv "$SIGNED_DIR"/*.exe.sig "${{ inputs.output-directory }}/"

    - name: Cleanup temporary signing directories
      shell: bash
      run: rm -rf ./signpath-signed-output ./signpath-staging
