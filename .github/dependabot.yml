version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v3's Pipeline Connector rejects our requests with "User has no access to the requested GitHub resource"
      # https://github.com/signpath/github-action-submit-signing-request/issues/18
      - dependency-name: "signpath/github-action-submit-signing-request"
        versions: [">= 3"]
