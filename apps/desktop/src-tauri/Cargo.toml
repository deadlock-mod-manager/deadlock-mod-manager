[package]
name = "deadlock-mod-manager"
version = "2.2.0"
description = "A mod manager for the Valve game Deadlock, built with Tauri, React, and TypeScript."
authors = ["stormix <hello@stormix.co>"]
license = "GPL-3.0"
repository = "https://github.com/deadlock-mod-manager/deadlock-mod-manager"
homepage = "https://github.com/deadlock-mod-manager/deadlock-mod-manager"
edition = "2024"


[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["tauri-wry", "match-sync"]
tauri-wry = [
  "tauri/wry",
  "dep:tauri-plugin-mcp-bridge",
  "tauri-plugin-dialog/gtk3",
]
e2e-harness = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "dep:libc",
]
# Recovers match salts through the user's Steam account (opt-in at runtime).
match-sync = ["dep:deadlock-match-sync"]

# `cef` is injected into [features] by scripts/cef-patch.ts for CEF builds only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("cef"))',
] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", default-features = false, features = [
  "devtools",
  "compression",
  "dynamic-acl",
  "protocol-asset",
] }
tauri-plugin-mcp-bridge = { version = "0.13.1", optional = true }
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tauri-plugin-opener = "2.7.2"
tauri-plugin-http = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11.1.0", features = ["serde-compat"] }
tauri-plugin-os = "2.4.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-fs = "2.7.1"
keyvalues-serde = "0.2"
regex = "1.12.3"
zip = "6.0.0"
bzip2 = "0.6"
zstd = "0.13"
tempfile = "3.27.0"
unrar = "0.5.8"
thiserror = "2.0.18"
sysinfo = { version = "0.37.2", features = ["windows"] }
tauri-plugin-log = "2.10.1"
log = { version = "0.4", features = ["kv"] }
tauri-plugin-process = "2.4.0"
sevenz-rust2 = "0.21.4"
steamlocate = "2.0.1"
tauri-plugin-deep-link = "2.6.2"
sha2 = "0.10"
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
machine-uid = "0.5.3"
vpk-parser = { path = "../../../packages/vpk-parser" }
hero-parser = { path = "../../../packages/hero-parser" }
source2-model = { path = "../../../packages/source2-model" }
vpkmanager = { path = "../../../packages/vpkmanager" }
dmp-parser = { path = "../../../packages/dmp-parser" }
kv-parser = { path = "../../../packages/kv-parser" }
deadlock-discord-presence = { path = "../../../packages/deadlock-discord-presence" }
deadlock-match-sync = { path = "../../../packages/deadlock-match-sync", optional = true }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7"
# Already in the tree via reqwest; the loopback forge bridge only needs the
# server half of the same versions, so this adds features rather than crates.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
diesel = { version = "2.3.12", default-features = false, features = [
  "sqlite",
  "r2d2",
  "32-column-tables",
] }
diesel_migrations = "2.3.2"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
futures = "0.3"
# Select the Linux dialog backend per runtime; CEF cannot share RFD's GTK loop.
tauri-plugin-dialog = { version = "2.8.3", default-features = false }
memchr = "2.8.0"
notify = "8.2.0"
clap = { version = "4.6", features = ["derive"] }
urlencoding = "2.1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-clipboard-manager = "2.5.0"
dirs = "6"
ttf-parser = "0.24"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
keyvalues-parser = "0.2"
dmm-plugin-runtime = { path = "../../../packages/plugin-runtime" }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

# No tray on Linux: GNOME hides tray icons without an extension, and the
# appindicator library isn't available everywhere the app ships
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri = { version = "2.12.4", default-features = false, features = [
  "protocol-asset",
  "tray-icon",
] }

# Lets E2E crash checkpoints skip exit handlers that can stall WebKitGTK
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
junction = "1"
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Wmi",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.0"
