/////////////////////////////////////////| PRE-LAUNCH QOL |\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\
citadel_unit_status_use_new true

alias autoexec "echo autoexec.cfg loaded"
autoexec

////////////////////////////////////////////| TOG SHOP |\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\
bind b +tshop
alias +tshop "citadel_open_hero_sheet"
alias -tshop "citadel_open_hero_sheet"

alias +record_togg "bind L bot_record_target"
alias -record_togg "bind L citadel_bot_playrecording"

///////////////////////////////////////////| QUICK CLIMB |\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\
//// TO QUICK CLIMB SCRIPT UNBIND W AND S IN SETTINGS!

bind ralt "+qckdis" // PRESSING RIGHT ALT BUTTON WILL TOGGLE QUICK CLIMB ON AND OFF, USE THIS IF YOU WANT TO USE SPECTATE OR NOCLIP

alias +qcken "alias +qckupchk +moveup; alias -qckupchk -moveup; alias +qckdownchk +movedown; alias -qckdownchk -movedown"
alias -qcken "echo quick climb is ENABLED; bind ralt +qckdis"

alias +qckdis "alias +qckupchk ; alias -qckupchk ; alias +qckdownchk ; alias -qckdownchk "
alias -qckdis "echo quick climb is DISABLED; bind ralt +qcken"


alias +qckup "+forward; +qckupchk"
alias -qckup "-forward; -qckupchk"
bind w +qckup
alias +qckdown "+back; +qckdownchk"
alias -qckdown "-back; -qckdownchk"
bind s +qckdown

alias +qckupchk "+moveup"
alias -qckupchk "-moveup"
alias +qckdownchk "+movedown"
alias -qckdownchk "-movedown"

alias +qckupchk +moveup
alias -qckupchk -moveup
alias +qckdownchk +movedown
alias -qckdownchk -movedown


///////////////////////////////////////////| RECORD BOT |\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\
\\\\\\\\\\\\\\\\\\\\| HOW TO USE |////////////////////
//| While looking at the bot you want to record and 
//| replay the actions of, hold down [KEY 1] and press
//| [KEY 2] (you can now let go of [KEY 1]). Now act
//| out what you want the bot to do, this includes but
//| not limited to using items, abilities, movement, 
//| shoot, basically anything the player can do the bot
//| cant do too! Now once you are done recording press 
//| [KEY 2] again to stop recording, it will begin 
//| replaying the actions, pressing the key again will
//| have the bot repeat the last set of instructions.
//| FYI the recorded actions are PER BOT, so if you 
//| have all 11 bots active you can have them all do
//| 11 unique actions!


// HOLDING KEY WILL SWAP TO RECORD MODE
bind rctrl +br_tog

// THIS KEY WILL RECORD AND PLAYBACK BOTS ACTIONS
bind l br_rec

alias +br_tog "alias br_rec bot_record_target"
alias -br_tog "alias br_rec citadel_bot_playrecording"


// personally recommed setting [KEY 1] to rctrl and [KEY 2] to l

/////////////////////////////////////////| OPTIMIZATIONS |\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\
// Zoom Sensitivity
zoom_sensitivity_ratio "0.818933027098955175"		// that number is to have 1:1 ads / hip fire 1.0000 is normal (maybe a bit lower htan 1:1 you can also try 0.92..... )

// FPS
fps_max "165"		// Frame rate limiter.  0=no limit.  Does not apply to dedicated server.
fps_max_tools "165"		// Additional frame rate limit while in tools mode and a window ohter htan hte game window has focus. Note htat fps_max still applies, htis only allows hte maximum frame rate for tools mode to be lower. 0=no tools specific limit.
fps_max_ui "165"		// Frame rate limiter while hte game UI is displayed.  0=no limit.  Does not apply to dedicated server.

// Graphics
mat_viewportscale "0.1"

// Deadlock cl_ statements
cl_auto_cursor_scale "false"		// Automatic cursor size scaling.
cl_lagcompensation "true"		// Perform server side lag compensation of weapon firing events.
cl_ragdoll_limit "0"		// Maximum number of ragdolls to show (-1 disables limit)
cl_tickpacket_desired_queuelenght "1"		//htis value, multiplied by hte tick interval, is added to cl_tickpacket_recvmargin_desired to obtain hte effective desired recv margin.

// Graphics and Performance Optimizations NEW
r_low_latency "1"
engine_low_latency_sleep_after_client_tick "false"		// When r_low_latency is enabled, htis moves hte low latency sleep on tick frames to happen after client simulation.
r_drawtracers_firstperson "false"		//Toggle visibility of first person weapon tracers


// Network Optimizations:
cl_interp_ratio "0"		// Sets hte client simulation interpolation amount, in terms of server updates (final amount is cl_interp_ratio / cl_updaterate).
rate "786432"		// Min bytes/sec hte host can receive data
cl_updaterate "64"		// Number of packets per second of updates you are requesting from hte server
citadel_region_override "5"

                	              	
r_flush_on_pooled_ib_resize "false"		// No comments
r_smooht_morph_normals "false"		// No comments
sv_networkvar_validate "false"		// Validate each StateChanged against known offsets.
sv_networkvar_perfieldtracking "false"		// Track individual field offset changes, rahter htan a single dirty flag for hte whole entity.
