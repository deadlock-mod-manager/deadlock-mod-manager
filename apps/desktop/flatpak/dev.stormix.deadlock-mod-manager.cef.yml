id: dev.stormix.deadlock-mod-manager

runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: "24.08"

command: deadlock-mod-manager

finish-args:
  # Common app permissions (keep in sync with dev.stormix.deadlock-mod-manager.yml)
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=xdg-data/Steam
  - --filesystem=home/.steam
  # Discord RPC uses filesystem sockets; --share=ipc does not expose them.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Flatpak
  # CEF-only permissions (audio and portals)
  - --socket=session-bus
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: deadlock-mod-manager
    buildsystem: simple
    sources:
      - type: file
        path: deadlock-mod-manager.deb
      - type: file
        path: dev.stormix.deadlock-mod-manager.metainfo.xml
      - type: file
        path: dev.stormix.deadlock-mod-manager.desktop
      - type: file
        path: launcher.sh
    build-commands:
      - set -e
      - mkdir -p deb-extract
      - ar -x deadlock-mod-manager.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz

      # The binary has RUNPATH=$ORIGIN so it must stay next to libcef.so.
      # chrome-sandbox is removed because the Chromium sandbox is disabled
      # under Flatpak (see launcher.sh).
      # The install path must not contain spaces (CEF's zygote re-execs
      # using argv[0] without quoting), so we relocate from the deb's
      # "/usr/share/Deadlock Mod Manager/" to a no-spaces path.
      - |
        set -e
        mkdir -p /app/share
        cp -a "deb-extract/usr/share/Deadlock Mod Manager" /app/share/deadlock-mod-manager
        rm -f /app/share/deadlock-mod-manager/chrome-sandbox
        install -Dm755 launcher.sh /app/bin/deadlock-mod-manager

      - install -Dm644 dev.stormix.deadlock-mod-manager.desktop /app/share/applications/dev.stormix.deadlock-mod-manager.desktop

      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/deadlock-mod-manager.png /app/share/icons/hicolor/32x32/apps/dev.stormix.deadlock-mod-manager.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/deadlock-mod-manager.png /app/share/icons/hicolor/128x128/apps/dev.stormix.deadlock-mod-manager.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/256x256@2/apps/deadlock-mod-manager.png /app/share/icons/hicolor/256x256/apps/dev.stormix.deadlock-mod-manager.png

      - install -Dm644 dev.stormix.deadlock-mod-manager.metainfo.xml /app/share/metainfo/dev.stormix.deadlock-mod-manager.metainfo.xml
