# The workspace manifest is at the repo root. Cargo only reads this file when it
# runs from apps/desktop or below, so run desktop cargo commands from here.
[build]
# Relative to apps/desktop. Without it the build would land in <repo>/target.
target-dir = "target"

# Statically link the MSVC runtime. unrar_sys compiles C++, so a dynamic CRT
# makes the exe import MSVCP140.dll and fail to start on machines without the
# Visual C++ Redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
# Use the LLVM linker bundled with Rust; no separate LLVM install is needed.
linker = "rust-lld"
