# Statically link the MSVC runtime. unrar_sys compiles C++, so a dynamic CRT
# makes the exe import MSVCP140.dll and fail to start on machines without the
# Visual C++ Redistributable. Lives at the workspace root so it applies whether
# cargo runs from here or from src-tauri.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
# Use the LLVM linker bundled with Rust; no separate LLVM install is needed.
linker = "rust-lld"
