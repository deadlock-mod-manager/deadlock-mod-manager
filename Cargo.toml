# Lives at the repo root so the path dependencies in packages/ sit inside the
# workspace root. Cargo then hashes their relative path into crate metadata,
# which keeps compiler-cache keys identical across git worktrees.
[workspace]
members = ["apps/desktop/src-tauri"]
# These crates keep their own lockfile and target directory.
exclude = ["packages"]
resolver = "2"

# CEF builds inject a Tauri git patch and cef feature via apps/desktop/scripts/cef-patch.ts (local) or _build-cef.yml (CI).
# Run `pnpm --filter desktop cef:cleanup` after local CEF work to restore Wry builds.

[profile.dev]
# Keep backtrace locations without generating full debugger data.
debug = "line-tables-only"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
debug = false
