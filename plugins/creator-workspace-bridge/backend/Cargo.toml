[package]
name = "creator-workspace-bridge"
version = "0.1.0"
edition = "2024"
description = "Creator Workspace Bridge plugin backend for Deadlock Mod Manager"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
dmm-plugin-sdk = { path = "../../../packages/plugin-sdk-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
