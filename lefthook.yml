pre-commit:
  jobs:
    - run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
    - run: pnpm exec oxlint --fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
      stage_fixed: true
    - run: cargo clippy --all-targets
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
      root: apps/desktop
    - run: cargo clippy --all-targets --all-features
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
      root: packages/dmodpkg
    - run: cargo clippy --all-targets --all-features
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
      root: packages/vpk-parser
