
apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: {{ .Chart.Name }}-redis
spec:
  sentinel:
    replicas: {{ .Values.resources.redis.sentinels }}
    resources:
      requests:
        cpu: 25m
        memory: 100Mi
      limits:
        memory: 100Mi
    exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 100Mi
  redis:
    replicas: {{ .Values.resources.redis.replicas }}
    {{- $maxmemory := .Values.resources.redis.memory }}
    {{- if hasSuffix "Gi" $maxmemory }}
      {{- $maxmemory = trimSuffix "Gi" $maxmemory | mulf 1074 }}
    {{- else if hasSuffix "Mi" $maxmemory }}
      {{- $maxmemory = trimSuffix "Mi" $maxmemory | mulf 1.049 | int }}
    {{- else }}
      {{- fail "resources.redis.memory must use Gi or Mi format" }}
    {{- end }}
    customConfig:
      - maxmemory {{ $maxmemory }}mb
      {{- if .Values.resources.redis.evictionPolicy }}
      - maxmemory-policy {{ .Values.resources.redis.evictionPolicy }}
      {{- end }}
    tolerations:
      - key: role
        value: database
        effect: NoSchedule
    nodeSelector:
      node-role.kubernetes.io/database: ""
    resources:
      requests:
        cpu: {{ .Values.resources.redis.cpu }}
        memory: {{ .Values.resources.redis.memory }}
    exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 100Mi
    storage:
      persistentVolumeClaim:
        metadata:
          name: {{ .Chart.Name }}-redis
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: {{ .Values.resources.redis.disk }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-redis-master
spec:
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: 6379
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-redis
    app.kubernetes.io/part-of: redis-failover
    redisfailovers-role: master
  type: ClusterIP
