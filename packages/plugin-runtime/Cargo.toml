[package]
name = "dmm-plugin-runtime"
version = "0.1.0"
edition = "2024"
description = "External plugin packages, permissions and supervised WASM execution for DMM"
license = "GPL-3.0"
publish = false

[dependencies]
base64 = "0.22"
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ts-rs = { version = "11.1.0", features = ["serde-compat"] }
zip = "6.0.0"
vpk-parser = { path = "../vpk-parser" }
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmparser = { version = "0.262", default-features = false, features = ["std", "validate", "features"] }

[dev-dependencies]
tempfile = "3.27.0"
vpkmanager = { path = "../vpkmanager" }
wat = "1"

[workspace]
