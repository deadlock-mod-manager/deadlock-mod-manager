[package]
name = "vpkmanager"
version = "0.1.0"
edition = "2024"
description = "Writing Deadlock VPKs and the compiled Source 2 assets inside them"
license = "GPL-3.0"

[lib]
name = "vpkmanager"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
thiserror = "2.0"
symphonia = { version = "0.5", default-features = false, features = [
  "flac",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
crc = "3.0"
bitflags = "2"
byteorder = "1"
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
ruzstd = "0.8.3"
bcdec_rs = "0.2"
intel_tex_2 = "0.5"
rayon = "1"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
